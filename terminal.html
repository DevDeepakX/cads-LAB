<!DOCTYPE html>
<html>
<head>
    <title>Command Terminal</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">

<h2>Cloud Security Terminal</h2>

<div class="terminal-box" id="terminalBox">
        
</div>
<div class="row">
    <div class="col card">
        <form method="post" id="cmdForm" class="controls">
                <input id="cmdInput" type="text" name="command" autofocus placeholder="Type command here" style="flex:1;">
                <button type="submit">EXECUTE</button>
                <a href="/reset"><button type="button">RESET</button></a>
                <a href="/logs"><button type="button">LOGS</button></a>
        </form>

        <div class="muted">Tip: Try <strong>aws s3 ls</strong> then <strong>aws s3 cp ...</strong></div>
    </div>

    <div class="col card">
        <h3>Live Timeline</h3>
        <div id="timeline" style="max-height:320px;overflow:auto;padding:6px"></div>
    </div>
</div>

<script>
const terminalBox = document.getElementById('terminalBox');
function scrollTerminal(){ terminalBox.scrollTop = terminalBox.scrollHeight; }
scrollTerminal();

async function fetchLogs(){
    try{
        const res = await fetch('/api/logs');
        const data = await res.json();
        const el = document.getElementById('timeline');
        el.innerHTML = '';
        (data.events || []).forEach(e=>{
            const p = document.createElement('p'); p.className='log';
            p.textContent = `${e.timestamp} — ${e.event} — ${e.source_ip} — ${e.action}`;
            el.appendChild(p);
        });
    }catch(err){ console.warn(err); }
}

setInterval(fetchLogs, 2000);
fetchLogs();

// auto-focus and scroll terminal on submit
document.getElementById('cmdForm').addEventListener('submit', ()=> setTimeout(()=>{ scrollTerminal(); fetchLogs(); }, 200));
</script>

</div>
</body>
</html>
