<!DOCTYPE html>
<html>
<head>
    <title>Lab Reset</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">

    <h2>Lab Environment Reset</h2>

    <div class="terminal-box">
        <p class="prompt">destroy_lab --force</p>
        <p class="log">Removing attack artifacts...</p>
        <p class="log">Clearing logs...</p>
        <p class="log">Resetting session...</p>
        <p class="log success">Lab destroyed successfully.</p>
    </div>

    <a href="/labs">
        <button>START NEW LAB</button>
    </a>

</div>
</body>
</html>
