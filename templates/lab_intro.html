<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADS — {{ lab.title }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .intro-header { margin-bottom: 40px; text-align: left; }
        .intro-header h1 { font-size: 48px; margin-bottom: 12px; }

        .intro-content {
            background: rgba(102,126,234,0.03);
            border: 1px solid var(--border);
            padding: 40px; border-radius: 20px;
            margin-bottom: 30px;
        }
        
        .intro-section { margin-bottom: 30px; }
        .intro-section:last-child { margin-bottom: 0; }
        .intro-section h3 { color: var(--cyan); font-size: 20px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .intro-section p { font-size: 16px; color: var(--text); opacity: 0.9; line-height: 1.8; white-space: pre-line; }
        
        .cyber-list { list-style: none; padding: 0; margin-top: 10px; }
        .cyber-list li { margin-bottom: 10px; display: flex; align-items: center; gap: 10px; color: var(--text); font-size: 16px; opacity: 0.9; }
        .cyber-list li::before { content: '⚡'; color: var(--green); font-size: 14px; }
    </style>
</head>
<body>
<div class="container" style="max-width: 800px; padding-top: 10vh;">
    <header class="intro-header">
        <h1 class="gradient-text">{{ lab.title }}</h1>
    </header>

    <div class="intro-content">
        <div class="intro-section">
            <h3>📖 What is it?</h3>
            <p>{{ lab.intro_what }}</p>
        </div>
        
        <div class="intro-section">
            <h3>⚠️ How it happens:</h3>
            <ul class="cyber-list">
                {% for reason in lab.intro_how %}
                    <li>{{ reason }}</li>
                {% endfor %}
            </ul>
        </div>
        
        <div class="intro-section">
            <h3>🎯 What you will learn:</h3>
            <ul class="cyber-list">
                {% for concept in lab.intro_learn %}
                    <li>{{ concept }}</li>
                {% endfor %}
            </ul>
        </div>
    </div>

    <div style="margin-top: 40px; display: flex; justify-content: space-between;">
        <a href="/lab/{{ lab_id }}/select_mode" class="btn btn-outline" style="padding: 16px 32px;">← Back</a>
        <a href="/lab/{{ lab_id }}/tasks" class="btn btn-primary" style="padding: 16px 48px; font-size: 18px; box-shadow: 0 0 20px rgba(0,245,212,0.4);">Show Tasks →</a>
    </div>
</div>
</body>
</html>
