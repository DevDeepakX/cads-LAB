<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADS - Mission Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        :root {
            --bg-main: #0B1220;
            --bg-secondary: #0F1A2E;
            --gradient-1: #A855F7;
            --gradient-2: #D946EF;
            --gradient-3: #EC4899;
            --text-main: #E5E7EB;
            --text-sub: #9CA3AF;
            --text-muted: #6B7280;
            --accent-purple: #9333EA;
            --glass: rgba(255,255,255,0.05);

            --bg: var(--bg-main);
            --bg2: var(--bg-secondary);
            --bg3: #111a2f;
            --border: rgba(168, 85, 247, 0.3);
            --text: var(--text-main);
            --dim: var(--text-sub);
            --ai-bg: rgba(217, 70, 239, 0.04);
            --ai-border: rgba(217, 70, 239, 0.35);
            --ai-text: #f0abfc;
            
            --green: var(--gradient-1);
            --cyan: var(--gradient-2);
            --purple: var(--accent-purple);
            --pink: var(--gradient-3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: ''; position: fixed; inset: 0;
            background-image: linear-gradient(rgba(102,126,234,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(102,126,234,0.03) 1px, transparent 1px);
            background-size: 40px 40px; pointer-events: none; z-index: 0;
        }

        .page-wrap { position: relative; z-index: 1; padding: 20px; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; min-height: 100vh; }

        .page-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 24px; margin-bottom: 20px;
            background: linear-gradient(135deg, var(--bg2), var(--bg3));
            border: 1px solid var(--border); border-radius: 12px;
        }
        .page-header h1 {
            font-size: 22px; font-weight: 700; letter-spacing: 2px;
            background: linear-gradient(90deg, var(--green), var(--cyan), var(--purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .header-meta { display: flex; gap: 10px; align-items: center; }
        .badge {
            padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase;
        }
        .badge-mode-attack  { background: rgba(248,113,113,0.15); color: #f87171; border: 1px solid rgba(248,113,113,0.3); }
        .badge-mode-defense { background: rgba(52,211,153,0.15); color: #34d399; border: 1px solid rgba(52,211,153,0.3); }
        
        /* Removed Auth Actions from Header temporarily */

        .exit-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none; color: white; padding: 8px 16px; border-radius: 8px;
            cursor: pointer; font-weight: 700; font-size: 14px;
            transition: all 0.3s; box-shadow: 0 4px 15px rgba(102,126,234,0.3);
        }
        .exit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102,126,234,0.5); }
        
        #particles-js { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        .panel-card {
            border: 1px solid var(--cyan); border-radius: 12px;
            background: linear-gradient(135deg, var(--bg2), var(--bg3));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(217, 70, 239, 0.05), inset 0 0 0 1px var(--glass);
            padding: 24px;
        }

        .mission-heading { color: var(--green); font-size: 18px; font-weight: 700; margin-bottom: 16px; border-bottom: 1px solid rgba(168, 85, 247, 0.3); padding-bottom: 8px; }

        /* M1-M3 */
        .mission-grid-theory { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex: 1; }
        
        .mission-heading, .theory-text, .question-text, .mission-desc {
            font-family: inherit; font-style: italic; letter-spacing: 1.2px; font-weight: 500;
        }
        
        .theory-text { white-space: pre-wrap; font-size: 15px; color: var(--text); line-height: 1.7; }
        .question-text { font-size: 16px; color: var(--text); margin-bottom: 20px; font-weight: 600; }
        
        /* M4-M5 */
        .mission-grid-terminal { display: grid; grid-template-columns: 40% calc(60% - 20px); gap: 20px; flex: 1; }
        .left-col { display: flex; flex-direction: column; gap: 20px; }
        .mission-desc { font-size: 15px; color: var(--text); line-height: 1.6; }

        /* Form / Answers */
        .q-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); padding: 14px 16px; border-radius: 8px; color: var(--text); font-size: 15px; font-family: inherit; font-style: italic; outline: none; margin-bottom: 16px; }
        .q-input:focus { border-color: var(--cyan); box-shadow: 0 0 15px rgba(217, 70, 239, 0.2); }
        .q-submit { background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2)); border: none; color: #fff; padding: 14px 24px; border-radius: 8px; font-weight: 800; font-size: 15px; cursor: pointer; transition: all 0.2s; width: 100%;}
        .q-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(217, 70, 239, 0.4); }

        .next-btn { background: linear-gradient(135deg, #f6ad55, #ed8936); border: none; color: #0a0e1a; padding: 14px 24px; border-radius: 8px; font-weight: 800; font-size: 15px; cursor: pointer; transition: all 0.2s; width: 100%; animation: pulseBtn 2s infinite; }
        .next-btn:hover { transform: translateY(-2px); }
        @keyframes pulseBtn { 0%,100%{box-shadow: 0 0 10px rgba(246,173,85,0.4);} 50%{box-shadow: 0 0 25px rgba(246,173,85,0.8);} }

        /* Terminal Window */
        .terminal-window {
            background: #050810; border: 1px solid rgba(0,255,156,0.4); border-radius: 12px;
            box-shadow: 0 0 40px rgba(0,255,156,0.05), inset 0 0 15px rgba(0,255,156,0.05);
            display: flex; flex-direction: column; height: 100%; max-height: 650px; overflow: hidden;
        }
        .terminal-titlebar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: linear-gradient(135deg, #0d1117, #161b27); border-bottom: 1px solid rgba(0,255,156,0.15); flex-shrink: 0; }
        .terminal-dots { display: flex; gap: 6px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-r { background: #ff5f57; } .dot-y { background: #febc2e; } .dot-g { background: var(--green); }
        .terminal-title-label { font-size: 12px; color: var(--dim); font-family: 'JetBrains Mono', monospace; }

        .terminal-output { flex: 1; overflow-y: auto; padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.7; }
        .terminal-output::-webkit-scrollbar { width: 6px; }
        .terminal-output::-webkit-scrollbar-thumb { background: rgba(102,126,234,0.3); border-radius: 3px; }
        .tline { display: block; white-space: pre-wrap; word-break: break-all; }
        .tline-cmd  { color: var(--green);  }
        .tline-output { color: #8ab4f4; }
        .tline-error  { color: #f87171; }
        .tline-info   { color: var(--dim); }

        .input-area { padding: 12px 16px; background: #0a1020; border-top: 1px solid rgba(0,255,156,0.1); flex-shrink: 0; }
        .cmd-row { display: flex; align-items: center; gap: 10px; }
        .cmd-prompt { color: var(--green); font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; flex-shrink: 0; }
        .cmd-input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 14px; caret-color: var(--green); }
        .btn-execute { background: linear-gradient(135deg, #00ff9c, #00e5c7); border: none; color: #0a0e1a; padding: 8px 20px; border-radius: 7px; font-weight: 800; font-size: 13px; cursor: pointer; }

        /* Chatbot Widget */
        .chatbot-btn {
            position: absolute; bottom: 20px; right: 20px;
            width: 60px; height: 60px; border-radius: 50%;
            background: linear-gradient(135deg, var(--bg2), var(--bg3));
            border: 2px solid var(--cyan); color: #fff; font-size: 24px; font-weight: 800;
            cursor: pointer; box-shadow: 0 0 25px rgba(0,180,255,0.6);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
        }
        .chatbot-popup {
            position: absolute; bottom: 90px; right: 20px;
            width: 340px; height: 450px;
            background: rgba(5, 10, 20, 0.98); border: 1px solid var(--cyan);
            border-radius: 16px; box-shadow: 0 15px 50px rgba(0,180,255,0.2);
            display: none; flex-direction: column; z-index: 1000; overflow: hidden;
        }
        
        .chatbot-header { padding: 16px; background: rgba(15,22,40,0.9); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .chatbot-title { font-size: 16px; font-weight: 700; color: #fff; }
        .chatbot-close { color: var(--dim); cursor: pointer; font-size: 20px; }
        .ai-msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .ai-bubble { padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.5; max-width: 90%; }
        .ai-bubble.bot { background: rgba(0,229,255,0.06); border: 1px solid var(--border); color: var(--ai-text); }
        .ai-bubble.user { background: rgba(102,126,234,0.12); border: 1px solid var(--border); color: var(--text); align-self: flex-end; }
        .ai-chat-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
        .ai-chat-input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; outline: none;}
        .ai-send-btn { background: linear-gradient(135deg, #00e5ff, #00b4cc); border: none; color: #0a0e1a; padding: 8px 14px; border-radius: 8px; font-weight: 800; cursor: pointer; }

        /* Complete Popup */
        #completePopup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            background: rgba(5,10,20,0.95); border: 2px solid var(--cyan);
            box-shadow: 0 0 50px rgba(0,229,255,0.6), inset 0 0 20px rgba(0,229,255,0.1);
            color: var(--cyan); padding: 30px 60px; border-radius: 20px;
            font-size: 32px; font-weight: 800; letter-spacing: 4px; z-index: 9999;
            opacity: 0; pointer-events: none; transition: all 0.3s ease;
        }
        #completePopup.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        .cyber-font { font-family: 'JetBrains Mono', monospace; font-style: italic; }


    </style>
</head>
<body>
<!-- Particles Background -->
<div id="particles-js"></div>
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<div class="page-wrap">

    <div class="page-header">
        <h1 id="missionTitle">CLOUD SECURITY LAB</h1>
        <div class="header-meta">
            <span class="badge badge-mode-attack" id="modeLabel" style="display:none;">MODE</span>
            <button class="exit-btn" onclick="window.location.href='/'">Exit Lab</button>
        </div>
    </div>

    <div id="missionView" style="display: flex; flex: 1; flex-direction: column;">
        <!-- Injected here -->
    </div>

</div>

<!-- Terminal Wrapper (Kept outside to preserve state) -->
<div id="terminalWrapper" style="display:none; height:100%; position:relative;">
    <div class="terminal-window">
        <div class="terminal-titlebar">
            <div class="terminal-dots"><div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div></div>
            <span class="terminal-title-label">player@cads-lab:~$</span>
        </div>
        <div class="terminal-output" id="termOutput">
            {% for line in output %}
                {% if line.startswith('$ ') %}
                    <span class="tline tline-cmd">{{ line }}</span>
                {% elif line.startswith('[') %}
                    <span class="tline tline-info">{{ line }}</span>
                {% else %}
                    <span class="tline tline-output">{{ line }}</span>
                {% endif %}
            {% endfor %}
        </div>
        <div class="input-area">
            <div class="cmd-row">
                <span class="cmd-prompt">$</span>
                <input id="cmdInput" class="cmd-input" type="text" autocomplete="off" spellcheck="false" placeholder="Enter command...">
                <button class="btn-execute" id="execBtn" onclick="executeCommand()">Run</button>
            </div>
        </div>
    </div>

    <!-- Chatbot attached to terminal -->
    <button class="chatbot-btn" id="chatbotBtn" onclick="toggleChatbot()">🤖</button>
    <div class="chatbot-popup" id="chatbotPopup">
        <div class="chatbot-header">
            <span class="chatbot-title">Jarvis here</span>
            <span class="chatbot-close" onclick="toggleChatbot()">X</span>
        </div>
        <div class="ai-msgs" id="aiMsgs">
            <div class="ai-bubble bot">Hello! I'm here to help with your lab mission. Ask me anything!</div>
        </div>
        <form class="ai-chat-form" onsubmit="sendChat(event)">
            <input id="chatInput" class="ai-chat-input" placeholder="Ask question..." autocomplete="off">
            <button type="submit" class="ai-send-btn">Send</button>
        </form>
</div>



<div id="completePopup" class="cyber-font">MISSION COMPLETED</div>

<script>
let tasksList = [];
let activeTask = null;
const termOutput = document.getElementById('termOutput');
const cmdInput   = document.getElementById('cmdInput');
const execBtn    = document.getElementById('execBtn');
const missionView = document.getElementById('missionView');
const terminalWrapper = document.getElementById('terminalWrapper');
let isExecuting = false;



function scrollTerm()  { termOutput.scrollTop = termOutput.scrollHeight; }
function scrollChat()  { document.getElementById('aiMsgs').scrollTop = document.getElementById('aiMsgs').scrollHeight; }
scrollTerm();

async function init() {
    await fetchTasks();
}

async function fetchTasks() {
    try {
        const res = await fetch('/api/tasks');
        const data = await res.json();
        tasksList = data.tasks || [];
        renderActiveMission();
    } catch(e) { console.error('fetch tasks err', e); }
}

function renderActiveMission() {
    let activeIndex = tasksList.findIndex(t => t.status !== 'completed');
    
    if (activeIndex === -1) {
        document.getElementById('missionTitle').textContent = "LAB COMPLETED";
        missionView.innerHTML = `<div class="panel-card" style="text-align:center; padding: 60px;">
            <h2 style="color:var(--cyan); font-size:32px; margin-bottom:20px;">ALL MISSIONS COMPLETE</h2>
            <p style="color:var(--text); font-size:18px;">You have successfully secured the lab.</p>
        </div>`;
        terminalWrapper.style.display = 'none';
        return;
    }
    
    activeTask = tasksList[activeIndex];
    document.getElementById('missionTitle').textContent = activeTask.title;
    
    if (activeTask.type === 'theory') {
        renderTheoryMission(activeTask);
    } else {
        renderTerminalMission(activeTask);
    }
}

function renderTheoryMission(t) {
    terminalWrapper.style.display = 'none'; // hide terminal and chatbot
    document.getElementById('chatbotBtn').style.display = 'none';
    
    missionView.innerHTML = `
        <div class="mission-grid-theory">
            <div class="panel-card">
                <div class="mission-heading">Learning Material</div>
                <div class="theory-text">${(t.theory || t.description).replace(/\\n/g, '<br>')}</div>
            </div>
            <div class="panel-card">
                <div class="mission-heading">Objective</div>
                <div class="question-text">${t.question || 'Answer the question to proceed:'}</div>
                <div id="ansContainer">
                    <input type="text" id="m_ans_${t.id}" class="q-input" placeholder="Enter answer...">
                    <button class="q-submit" onclick="submitAns('${t.id}')">Submit</button>
                    <div id="m_err_${t.id}" style="color:#f87171;margin-top:12px;display:none;font-weight:600;"></div>
                </div>
            </div>
        </div>
    `;
    const inEl = document.getElementById(`m_ans_${t.id}`);
    if(inEl) inEl.addEventListener('keydown', e => { if(e.key === 'Enter') submitAns(t.id); });
}

function renderTerminalMission(t) {
    // We attach terminalWrapper into the right col dynamically
    missionView.innerHTML = `
        <div class="mission-grid-terminal">
            <div class="left-col">
                <div class="panel-card">
                    <div class="mission-heading">Mission Directive</div>
                    <div class="mission-desc">${t.description}</div>
                </div>
                <div class="panel-card">
                    <div class="mission-heading">Objective</div>
                    <div class="question-text">${t.question || 'Find the answer using the terminal:'}</div>
                    <div id="ansContainer">
                        <input type="text" id="m_ans_${t.id}" class="q-input" placeholder="Found the answer? Type here...">
                        <button class="q-submit" onclick="submitAns('${t.id}')">Submit</button>
                        <div id="m_err_${t.id}" style="color:#f87171;margin-top:12px;display:none;font-weight:600;"></div>
                    </div>
                </div>
            </div>
            <div class="right-col" id="terminalSlot">
                <!-- Terminal goes here -->
            </div>
        </div>
    `;
    
    document.getElementById('terminalSlot').appendChild(terminalWrapper);
    terminalWrapper.style.display = 'block';
    document.getElementById('chatbotBtn').style.display = 'flex'; // show only for M4/M5
    document.getElementById('chatbotPopup').style.display = 'none'; // hide by default on load

    const inEl = document.getElementById(`m_ans_${t.id}`);
    if(inEl) inEl.addEventListener('keydown', e => { if(e.key === 'Enter') submitAns(t.id); });
}

async function submitAns(id) {
    const input = document.getElementById('m_ans_'+id);
    const err = document.getElementById('m_err_'+id);
    const val = input.value.trim();
    if (!val) return;
    
    const res = await fetch('/api/submit_task', {
        method: 'POST',
        headers: { 'Content-Type':'application/json'},
        body: JSON.stringify({ task_id: id, answer: val })
    });
    const data = await res.json();
    
    if(data.success) {
        err.style.display = 'none';
        showCompletePopup();
        document.getElementById('ansContainer').innerHTML = `
            <div style="color:var(--green); font-weight:700; margin-bottom:16px; font-size:16px; text-transform:uppercase;">✅ completed</div>
            <button class="next-btn" onclick="goToNext()">Go to next mission</button>
        `;
    } else {
        err.textContent = "Incorrect answer. Try again.";
        err.style.display = 'block';
    }
}

function goToNext() {
    fetchTasks();
}

function showCompletePopup() {
    let p = document.getElementById('completePopup');
    p.classList.remove('show');
    void p.offsetWidth;
    p.classList.add('show');
    setTimeout(() => { p.classList.remove('show'); }, 2000);
    
    try {
        const audio = new Audio('/static/defend.mp3'); // Fills requirement: Play defend sound
        audio.play().catch(e => {}); 
    } catch(e) {}
}

async function executeCommand() {
    if (isExecuting) return;
    const cmd = cmdInput.value.trim();
    if (!cmd) return;

    isExecuting = true; execBtn.disabled = true;
    cmdInput.value = '';

    appendLines([`$ ${cmd}`]);

    try {
        const res = await fetch('/api/terminal_execute', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ command: cmd }),
        });
        const data = await res.json();
        if (data.new_lines) appendLines(data.new_lines);
    } catch (err) {
        appendLines([`[error] Request failed: ${err.message}`]);
    }

    isExecuting = false; execBtn.disabled = false;
    cmdInput.focus();
}

cmdInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); executeCommand(); } });

function appendLines(lines) {
    if(!lines) return;
    if(!Array.isArray(lines)) lines = [];
    lines.forEach(txt => {
        const s = document.createElement('span');
        if (txt.startsWith('$ ')) s.className = 'tline tline-cmd';
        else if (txt.startsWith('[')) s.className = 'tline tline-info';
        else s.className = 'tline tline-output';
        s.textContent = txt;
        termOutput.appendChild(s);
    });
    scrollTerm();
}

// Chatbot functionality
function toggleChatbot() {
    const pop = document.getElementById('chatbotPopup');
    pop.style.display = pop.style.display === 'none' ? 'flex' : 'none';
    if(pop.style.display === 'flex') document.getElementById('chatInput').focus();
}

function appendChatBubble(text, cls) {
    const d = document.createElement('div');
    d.className = `ai-bubble ${cls}`;
    d.textContent = text;
    document.getElementById('aiMsgs').appendChild(d);
    scrollChat();
    return d;
}

async function sendChat(e) {
    e.preventDefault();
    const inf = document.getElementById('chatInput');
    const msg = inf.value.trim();
    if(!msg) return;
    inf.value = '';
    
    const lowerMsg = msg.toLowerCase();
    if (['hi', 'hello', 'buddy', 'dude'].includes(lowerMsg)) {
        appendChatBubble(msg, 'user');
        appendChatBubble('What can I help you 😊', 'bot');
        return;
    }
    
    appendChatBubble(msg, 'user');
    const lEl = appendChatBubble('Thinking...', 'bot');
    
    try {
        const res = await fetch('/chatbot_api', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg, task_context: activeTask?.id })
        });
        
        // Sometimes backend handles /chatbot_api differently. 
        // We ensure simple UI logic.
        const data = await res.json();
        lEl.remove();
        appendChatBubble(data.reply || data.message || 'No response.', 'bot');
    } catch(err) {
        lEl.remove();
        appendChatBubble('Connection error.', 'bot');
    }
}

// Initialize particles manually after short delay
setTimeout(() => {
    if(window.particlesJS) {
        particlesJS('particles-js', {
          "particles": {
            "number": { "value": 40, "density": { "enable": true, "value_area": 800 } },
            "color": { "value": "#667eea" },
            "shape": { "type": "circle" },
            "opacity": { "value": 0.3, "random": false },
            "size": { "value": 3, "random": true },
            "line_linked": { "enable": true, "distance": 150, "color": "#00e5ff", "opacity": 0.2, "width": 1 },
            "move": { "enable": true, "speed": 1, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
          },
          "interactivity": { "detect_on": "canvas", "events": { "onhover": { "enable": false }, "onclick": { "enable": false }, "resize": true } },
          "retina_detect": true
        });
    }
}, 500);

init();
</script>
</body>
</html>
