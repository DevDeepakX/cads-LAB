<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADS — {{ lab.title }} Mode</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .mode-header { text-align: left; margin-bottom: 40px; }
        .mode-header h1 { font-size: 48px; margin-bottom: 12px; }
        .mode-header p { font-size: 20px; color: var(--dim); }

        .mode-selection-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin: 0 auto;
        }

        .mode-choice {
            padding: 40px 32px; border-radius: 20px;
            text-align: center; border: 1px solid var(--border);
            background: rgba(102,126,234,0.03); transition: all 0.3s;
            display: flex; flex-direction: column; gap: 20px;
        }
        .mode-choice:hover { transform: translateY(-5px); background: rgba(102,126,234,0.06); }

        .mode-icon { font-size: 48px; }
        .mode-choice h3 { font-size: 24px; margin: 0; color: var(--text); }
        .mode-choice p { font-size: 16px; color: var(--dim); min-height: 60px; }

        .btn-start {
            width: 100%; padding: 16px; border-radius: 12px;
            font-weight: 700; font-size: 16px; cursor: pointer;
            border: 1px solid var(--border); background: transparent; color: var(--text);
            transition: all 0.2s;
        }
        .btn-start:hover { background: var(--cyan); color: #000; border-color: var(--cyan); }
    </style>
</head>
<body>
<div class="container" style="max-width: 900px; padding-top: 10vh;">
    <header class="mode-header">
        <h1 class="gradient-text">{{ lab.title }}</h1>
        <p>Step 2: Select Mode</p>
    </header>

    <div class="mode-selection-container">
        {% for mode_name in lab.modes %}
        <article class="mode-choice">
            <h3>{{ mode_name }}</h3>
            <p>Play the lab scenario from the {% if 'Attack' in mode_name %}offensive{% else %}defensive{% endif %} perspective.</p>
            <form action="/lab/{{ lab_id }}/start" method="post" style="margin-top: auto;">
                <input type="hidden" name="mode" value="{{ mode_name }}">
                <button type="submit" class="btn-start">Select {{ mode_name }}</button>
            </form>
        </article>
        {% endfor %}
    </div>

    <div style="margin-top: 40px; display: flex; justify-content: space-between;">
        <a href="/labs" class="btn btn-outline" style="padding: 16px 32px;">← Back</a>
    </div>
</div>
</body>
</html>
