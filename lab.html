<!DOCTYPE html>
<html>
<head>
    <title>S3 Lab</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <h2>Lab: Open S3 Bucket</h2>

        <div class="row">
            <div class="col card">
                <h3>Overview</h3>
                <p class="prompt">scan_bucket --access public</p>
                <p class="log warning">⚠ Bucket is PUBLIC</p>
                <p class="log">Unauthorized access logged</p>
                <a href="/terminal"><button>OPEN TERMINAL</button></a>
            </div>

            <div class="col card">
                <h3>Choose Mode</h3>
                <form action="/select_mode" method="post" class="controls">
                        <button name="mode" value="attack" type="submit">Attack Mode (AI Defense)</button>
                        <button name="mode" value="defense" type="submit">Defense Mode (AI Attack)</button>
                </form>
                <p class="muted">Attack Mode: you attack, AI defends. Defense Mode: you defend, AI attacks.</p>
                <a href="/logs"><button>VIEW LOGS</button></a>
            </div>
        </div>

</body>
</html>
